spring.application.name=PaymentService
spring.datasource.url=jdbc:mysql://localhost:3306/account
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Show all the log from API responses (Optional)
spring.mvc.log-resolved-exception=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# Server Configuration
server.port=8084

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=36000000

# Service URLs
order.service.base-url=http://localhost:8081
account.service.base-url=http://localhost:8083